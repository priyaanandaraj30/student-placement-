<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login – PlaceHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
<div class="auth card"><div class="logo" style="margin:0">PlaceHub</div><h1>Welcome back</h1><p class="sub">Student Placement Dashboard</p>
<form id="f" novalidate>

<p class="sub" style="margin-top:14px">New here? <a href="register.html" style="color:var(--pr)">Register</a></p></div>
<script src="js/app.js"></script>
</body>
