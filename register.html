<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register – PlaceHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
<div class="auth card"><div class="logo" style="margin:0">PlaceHub</div><h1>Create account</h1><p class="sub">Student Placement Dashboard</p>
<form id="f" novalidate>
<label>Full name</label><input type="text" name="name"><div class="err" data-for="name"></div><label>Email</label><input type="email" name="email"><div class="err" data-for="email"></div><label>Password</label><input type="password" name="password"><div class="err" data-for="password"></div><label>Branch</label><select name="branch"><option value="">Select…</option><option>CSE</option><option>IT</option><option>ECE</option><option>EEE</option><option>Mechanical</option></select><div class="err" data-for="branch"></div><label>CGPA</label><input step="0.01" type="number" name="cgpa"><div class="err" data-for="cgpa"></div>
<button class="btn" style="width:100%;margin-top:18px">Register</button></form>
<p class="sub" style="margin-top:14px">Have an account? <a href="login.html" style="color:var(--pr)">Login</a></p></div>
<script src="js/app.js"></script>
</body>
</html>
